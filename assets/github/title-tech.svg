</defs>
        <text x="0" y="55" fill="url(#neon)" font-size="32" font-weight="bold" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Segoe UI Symbol'" letter-spacing="2">TECH STACK</text>
        <rect x="0" y="70" width="100" height="4" fill="url(#neon)" rx="2" />
